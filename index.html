<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bingo Multiplayer</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827}
.wrap{max-width:850px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:28px}.muted{color:#64748b;font-size:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}input,button{font:inherit}
input{padding:12px;border:1px solid #cbd5e1;border-radius:10px;flex:1;min-width:180px}
button{padding:12px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:#111827;color:#fff}
button.alt{background:#e5e7eb;color:#111827}button:disabled{opacity:.45;cursor:not-allowed}.hide{display:none}
.code{font-size:25px;font-weight:900;letter-spacing:3px;margin-top:4px}.players{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.player{padding:7px 11px;border-radius:999px;background:#f1f5f9;font-size:13px;font-weight:800}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.turn{text-align:center;padding:12px;background:#f1f5f9;border-radius:12px;font-weight:900;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cell{aspect-ratio:1;padding:0;background:#fff;color:#111827;border:1px solid #cbd5e1;font-size:20px}
.red{background:#ef4444!important;color:#fff!important}.green{background:#22c55e!important;color:#fff!important}.blue{background:#3b82f6!important;color:#fff!important}.yellow{background:#eab308!important;color:#111827!important}.cyan{background:#06b6d4!important;color:#fff!important}
.letters{display:flex;justify-content:center;gap:8px;margin-top:14px}.letter{width:44px;height:44px;display:grid;place-items:center;background:#e5e7eb;border-radius:10px;font-size:22px;font-weight:900;color:#94a3b8}.letter.on{background:#111827;color:#fff}
.winnerModal{position:fixed;inset:0;background:rgba(15,23,42,.72);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.winnerModal.show{display:flex}.winnerBox{width:min(430px,92vw);background:#fff;border-radius:24px;padding:30px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.3);animation:pop .28s ease-out}
.winTrophy{font-size:58px}.winTitle{font-size:30px;font-weight:950;margin-top:4px}.winSub{font-size:16px;color:#64748b;margin-top:8px}.count{font-size:58px;font-weight:950;line-height:1;margin-top:16px}
@keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:480px){.wrap{padding:12px}.cell{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>🎯 Bingo Multiplayer</h1><div class="muted">2–5 players • realtime • unique grids</div></div></div>

<section class="card" id="lobby">
  <div class="row">
    <button id="create">Create Game</button>
    <input id="code" maxlength="20" placeholder="Enter 4-digit code (e.g. 1423)">
    <input id="playerName" maxlength="20" placeholder="Name (optional)">
    <button class="alt" id="join">Join Game</button>
  </div>
  <div class="muted" id="status" style="margin-top:10px">Connecting…</div>
  <div id="room" class="hide">
    <div class="muted" style="margin-top:14px">GAME CODE</div>
    <div class="code" id="roomCode"></div>
    <div class="players" id="players"></div>
    <button id="start" style="margin-top:14px">Start Game</button>
  </div>
</section>

<section class="card hide" id="game">
  <div class="turn" id="turn"></div>
  <div class="players" id="gamePlayers"></div>
  <div class="grid" id="grid" style="margin-top:14px"></div>
  <div class="letters"><div class="letter">B</div><div class="letter">I</div><div class="letter">N</div><div class="letter">G</div><div class="letter">O</div></div>
</section>
</div>

<div class="winnerModal" id="winnerModal">
  <div class="winnerBox">
    <div class="winTrophy">🏆</div>
    <div class="winTitle" id="winTitle">BINGO!</div>
    <div class="winSub">Next round starts in</div>
    <div class="count" id="countdown">5</div>
  </div>
</div>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const sb=createClient(
 "https://qvdcesjoqyvaquvqjhej.supabase.co",
 "sb_publishable_I8c0NUO4Ff5A-XTge0PsJQ_XIDWtUCe"
);

const colors=[
 ["Red","red","#ef4444","🔴"],["Green","green","#22c55e","🟢"],
 ["Blue","blue","#3b82f6","🔵"],["Yellow","yellow","#eab308","🟡"],
 ["Cyan","cyan","#06b6d4","🩵"]
];

const id=crypto.randomUUID();
let channel=null,room="",host=false,players=[],state=null,countdownTimer=null,hostPlayerName="Player 1";

const $=x=>document.getElementById(x);
const lines=[];
for(let r=0;r<5;r++)lines.push([0,1,2,3,4].map(c=>r*5+c));
for(let c=0;c<5;c++)lines.push([0,1,2,3,4].map(r=>r*5+c));
lines.push([0,6,12,18,24],[4,8,12,16,20]);

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

/* Generates a 1–25 grid that is guaranteed not to be exactly equal
   to any grid already in the existing array. */
function uniqueGrid(existing=[]){
  const base=[...Array(25)].map((_,i)=>i+1);
  let g;
  do{g=shuffle([...base])}
  while(existing.some(x=>Array.isArray(x)&&x.join(",")===g.join(",")));
  return g;
}

function playerList(){
  $("players").innerHTML=$("gamePlayers").innerHTML=players.map((p,i)=>
    `<div class="player"><span class="dot" style="background:${colors[i][2]}"></span>P${i+1} ${escapeHtml(p.name)}</div>`
  ).join("");
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function snapshot(){if(state)state.hostPlayerName=hostPlayerName;return {room,players,state}}

async function send(type,data={}){
  if(channel)await channel.send({type:"broadcast",event:"bingo",payload:{type,room,...data}});
}

async function broadcast(){await send("snapshot",snapshot())}

function completed(pid){
  const g=state.grids[pid]||[];
  return lines.filter(line=>line.every(i=>state.marks[g[i]]!==undefined)).length;
}

function checkWinner(){
  for(const p of players){
    const n=completed(p.id);
    state.lines[p.id]=Math.min(5,n);
    if(n>=5&&state.winner===null)state.winner=players.findIndex(x=>x.id===p.id);
  }
}

function render(){
  if(!state)return;
  playerList();
  $("roomCode").textContent=room;

  if(state.status==="playing"){
    $("lobby").classList.add("hide");
    $("game").classList.remove("hide");

    const me=players.findIndex(p=>p.id===id);
    $("turn").textContent=state.winner!==null
      ?"Game Over"
      :`${colors[state.turn][3]} Player ${state.turn+1} — ${colors[state.turn][0]} turn`;

    const g=state.grids[id]||[];
    const box=$("grid");box.innerHTML="";
    g.forEach((n,i)=>{
      const b=document.createElement("button");
      b.className="cell";b.textContent=n;
      if(state.marks[n]!==undefined)b.classList.add(colors[state.marks[n]][1]);
      b.disabled=me!==state.turn||state.marks[n]!==undefined||state.winner!==null;
      b.onclick=()=>pick(n);
      box.appendChild(b);
    });

    document.querySelectorAll(".letter").forEach((x,i)=>
      x.classList.toggle("on",i<(state.lines[id]||0))
    );
  }else{
    $("lobby").classList.remove("hide");
    $("game").classList.add("hide");
    $("room").classList.remove("hide");
    $("start").disabled=!host||players.length<2;
    $("start").textContent=players.length<2
      ?"Start Game (need 2 players)"
      :host?"Start Game":"Waiting for host…";
    if(host && document.activeElement!==$("playerName") && $("playerName").value===""){
      $("playerName").value="";
    }
  }
}

function showWinnerCountdown(winnerIndex){
  const modal=$("winnerModal"),title=$("winTitle"),count=$("countdown");
  const winnerName=players[winnerIndex]?.name||("Player "+(winnerIndex+1));
  title.textContent="🏆 "+winnerName+" BINGO!";
  modal.classList.add("show");

  if(countdownTimer)clearInterval(countdownTimer);
  let n=5;
  count.textContent=n;

  countdownTimer=setInterval(async()=>{
    n--;
    if(n>0){count.textContent=n;return}

    clearInterval(countdownTimer);
    countdownTimer=null;

    setTimeout(async()=>{
      modal.classList.remove("show");
      if(!host||!state||state.status!=="playing")return;

      /* Winner starts the next round. Every board is regenerated and
         checked against all boards already generated for this round. */
      const first=winnerIndex;
      state.marks={};
      state.lines={};
      state.winner=null;
      state.turn=first;

      const used=[];
      players.forEach(p=>{
        state.grids[p.id]=uniqueGrid(used);
        used.push(state.grids[p.id]);
        state.lines[p.id]=0;
      });

      await broadcast();
      render();
    },1000);
  },1000);
}

async function handle(m){
  if(m.room!==room)return;

  if(m.type==="join"&&host&&state.status==="waiting"){
    if(players.length>=5||players.some(p=>p.id===m.id))return;
    players[0].name=hostPlayerName;

    const number=players.length+1;
    const name=(m.name||"").trim()||("Player "+number);

    players.push({id:m.id,name});
    state.grids[m.id]=uniqueGrid(Object.values(state.grids));
    state.lines[m.id]=0;

    await broadcast();
    render();
    return;
  }

  if(m.type==="snapshot"){
    players=m.players;
    state=m.state;
    if(!host && state.hostPlayerName)hostPlayerName=state.hostPlayerName;
    if(players.length>0 && players[0].id!==id && hostPlayerName){
      players[0].name=hostPlayerName;
    }
    render();

    if(state.winner!==null&&state.status==="playing"&&host){
      // Winner countdown is started only by the host's winning move below.
    }
    return;
  }

  if(m.type==="pick"&&host&&state.status==="playing"){
    if(m.player!==state.turn||state.marks[m.number]!==undefined)return;

    state.marks[m.number]=m.player;
    checkWinner();

    if(state.winner===null){
      state.turn=(state.turn+1)%players.length;
      await broadcast();
      render();
    }else{
      await broadcast();
      render();
      showWinnerCountdown(state.winner);
    }
  }
}

async function connect(c,isHost){
  room=c;host=isHost;

  channel=sb.channel("bingo:"+room,{
    config:{broadcast:{self:true},presence:{key:id}}
  });

  channel.on("broadcast",{event:"bingo"},e=>handle(e.payload));

  await channel.subscribe(async status=>{
    if(status==="SUBSCRIBED"){
      $("status").textContent="🟢 Realtime connected";
      await channel.track({id});
      if(!isHost)await send("join",{id,name:($("playerName").value||"").trim()});
    }
  });
}

$("create").onclick=async()=>{
  room="BINGO-"+(1000+Math.floor(Math.random()*9000));
  host=true;
  hostPlayerName="Player 1";
  players=[{id,name:"Player 1"}];
  state={
    status:"waiting",turn:0,marks:{},
    grids:{[id]:uniqueGrid([])},lines:{[id]:0},winner:null
  };
  await connect(room,true);
  render();
};

$("join").onclick=async()=>{
  const raw=$("code").value.trim().toUpperCase().replace(/^BINGO-?/,"");
  const digits=raw.replace(/\D/g,"").slice(-4);

  if(digits.length!==4){
    $("status").textContent="Please enter the 4-digit game code.";
    return;
  }

  const c="BINGO-"+digits;
  $("status").textContent="Joining…";
  host=false;players=[];

  state={status:"waiting",turn:0,marks:{},grids:{},lines:{},winner:null};

  await connect(c,false);
  render();
};

$("start").onclick=async()=>{
  if(!host||players.length<2)return;

  // Player 1's name is finalized when the host starts the game.
  hostPlayerName=($("playerName").value||"").trim()||"Player 1";
  if(players.length>0)players[0].name=hostPlayerName;

  state.status="playing";
  state.turn=0;
  state.marks={};
  state.lines={};
  state.winner=null;

  const used=[];
  players.forEach(p=>{
    state.grids[p.id]=uniqueGrid(used);
    used.push(state.grids[p.id]);
    state.lines[p.id]=0;
  });

  await broadcast();
  render();
};

async function pick(n){
  const p=players.findIndex(x=>x.id===id);
  if(!state||state.status!=="playing"||p!==state.turn||state.marks[n]!==undefined)return;
  await send("pick",{player:p,number:n});
}
</script>
</body>
</html>
