<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Multiplayer</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#111827}.wrap{max-width:820px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-top:16px}h1{margin:0;font-size:28px}.muted{color:#64748b;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}input,button{font:inherit}input{padding:12px;border:1px solid #cbd5e1;border-radius:10px;flex:1;min-width:180px}button{padding:12px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:#111827;color:white}button.alt{background:#e5e7eb;color:#111827}.hide{display:none}.code{font-size:25px;font-weight:900;letter-spacing:3px;margin-top:4px}.players{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.player{padding:7px 11px;border-radius:999px;background:#f1f5f9;font-size:13px;font-weight:800}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}.turn{text-align:center;padding:12px;background:#f1f5f9;border-radius:12px;font-weight:900;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cell{aspect-ratio:1;padding:0;background:white;color:#111827;border:1px solid #cbd5e1;font-size:20px}.red{background:#ef4444!important;color:white!important}.green{background:#22c55e!important;color:white!important}.blue{background:#3b82f6!important;color:white!important}.yellow{background:#eab308!important;color:#111827!important}.cyan{background:#06b6d4!important;color:white!important}.letters{display:flex;justify-content:center;gap:8px;margin-top:14px}.letter{width:44px;height:44px;display:grid;place-items:center;background:#e5e7eb;border-radius:10px;font-size:22px;font-weight:900;color:#94a3b8}.letter.on{background:#111827;color:white}#winner{text-align:center;font-size:21px;font-weight:900;min-height:30px;margin-top:12px}@media(max-width:480px){.wrap{padding:12px}.cell{font-size:17px}}</style></head><body><div class="wrap"><h1>🎯 Bingo Multiplayer</h1><div class="muted">2–5 players • realtime</div><div class="card" id="lobby"><div class="row"><button id="create">Create Game</button><input id="code" placeholder="Enter Game Code"><button class="alt" id="join">Join Game</button></div><div class="muted" id="status" style="margin-top:10px">Connecting…</div><div id="room" class="hide"><div class="muted" style="margin-top:14px">GAME CODE</div><div class="code" id="roomCode"></div><div class="players" id="players"></div><button id="start" style="margin-top:14px">Start Game</button></div></div><div class="card hide" id="game"><div class="turn" id="turn"></div><div class="players" id="gamePlayers"></div><div class="grid" id="grid" style="margin-top:14px"></div><div class="letters"><div class="letter">B</div><div class="letter">I</div><div class="letter">N</div><div class="letter">G</div><div class="letter">O</div></div><div id="winner"></div></div></div><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const sb=createClient("https://qvdcesjoqyvaquvqjhej.supabase.co","sb_publishable_I8c0NUO4Ff5A-XTge0PsJQ_XIDWtUCe"),id=crypto.randomUUID(),$=x=>document.getElementById(x),C=[["Red","red","#ef4444","🔴"],["Green","green","#22c55e","🟢"],["Blue","blue","#3b82f6","🔵"],["Yellow","yellow","#eab308","🟡"],["Cyan","cyan","#06b6d4","🩵"]];let ch=null,room="",host=false,players=[],state=null;const L=[];for(let r=0;r<5;r++)L.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)L.push([0,1,2,3,4].map(r=>r*5+c));L.push([0,6,12,18,24],[4,8,12,16,20]);const sh=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},grid=()=>sh([...Array(25)].map((_,i)=>i+1));function list(){let h=players.map((p,i)=>`<div class="player"><span class="dot" style="background:${C[i][2]}"></span>P${i+1} ${p.name}</div>`).join("");$("players").innerHTML=$("gamePlayers").innerHTML=h}async function send(type,d={}){if(ch)await ch.send({type:"broadcast",event:"bingo",payload:{type,room,...d}})}function snap(){return{room,players,state}}function done(pid){let g=state.grids[pid]||[];return L.filter(l=>l.every(i=>state.marks[g[i]]!==undefined)).length}function win(){for(let p of players){let n=done(p.id);state.lines[p.id]=Math.min(5,n);if(n>=5&&state.winner===null)state.winner=players.findIndex(x=>x.id===p.id)}}function render(){if(!state)return;list();$("roomCode").textContent=room;if(state.status!=="playing"){$("lobby").classList.remove("hide");$("game").classList.add("hide");$("room").classList.remove("hide");$("start").disabled=!host||players.length<2;$("start").textContent=players.length<2?"Start Game (need 2 players)":host?"Start Game":"Waiting for host…";return}$('lobby').classList.add('hide');$('game').classList.remove('hide');let me=players.findIndex(p=>p.id===id);$('turn').textContent=state.winner!==null?'Game Over':`${C[state.turn][3]} Player ${state.turn+1} — ${C[state.turn][0]} turn`;$('winner').textContent=state.winner!==null?`🏆 Player ${state.winner+1} BINGO!`:'';let g=state.grids[id]||[];$('grid').innerHTML='';g.forEach(n=>{let b=document.createElement('button');b.className='cell';b.textContent=n;if(state.marks[n]!==undefined)b.classList.add(C[state.marks[n]][1]);b.disabled=me!==state.turn||state.marks[n]!==undefined||state.winner!==null;b.onclick=()=>pick(n);$('grid').appendChild(b)});document.querySelectorAll('.letter').forEach((x,i)=>x.classList.toggle('on',i<(state.lines[id]||0)))}async function broadcast(){await send('snapshot',snap())}async function handle(m){if(m.room!==room)return;if(m.type==='join'&&host&&state.status==='waiting'){if(players.length>=5||players.some(p=>p.id===m.id))return;players.push({id:m.id,name:'Player '+(players.length+1)});state.grids[m.id]=grid();state.lines[m.id]=0;await broadcast();render()}else if(m.type==='snapshot'){players=m.players;state=m.state;render()}else if(m.type==='pick'&&host&&state.status==='playing'){if(m.player!==state.turn||state.marks[m.number]!==undefined)return;state.marks[m.number]=m.player;win();if(state.winner===null)state.turn=(state.turn+1)%players.length;await broadcast();render()}}async function connect(c,h){room=c;host=h;ch=sb.channel('bingo:'+room,{config:{broadcast:{self:true},presence:{key:id}}});ch.on('broadcast',{event:'bingo'},e=>handle(e.payload));await ch.subscribe(async s=>{if(s==='SUBSCRIBED'){$('status').textContent='🟢 Realtime connected';await ch.track({id});if(!h)await send('join',{id})}})}$('create').onclick=async()=>{room='BINGO-'+(1000+Math.floor(Math.random()*9000));host=true;players=[{id,name:'Player 1'}];state={status:'waiting',turn:0,marks:{},grids:{[id]:grid()},lines:{[id]:0},winner:null};await connect(room,true);render()};$('join').onclick=async()=>{let c=$('code').value.trim().toUpperCase();if(!c)return;$('status').textContent='Joining…';host=false;players=[];state={status:'waiting',turn:0,marks:{},grids:{},lines:{},winner:null};await connect(c,false);await send('join',{id});render()};$('start').onclick=async()=>{if(!host||players.length<2)return;state.status='playing';state.turn=0;state.marks={};state.lines={};state.winner=null;players.forEach(p=>{if(!state.grids[p.id])state.grids[p.id]=grid();state.lines[p.id]=0});await broadcast();render()};async function pick(n){let p=players.findIndex(x=>x.id===id);if(!state||state.status!=='playing'||p!==state.turn||state.marks[n]!==undefined)return;await send('pick',{player:p,number:n})}</script></body></html>
